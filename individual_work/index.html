
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5 - Individual Work</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>JavaScript Tasks 6–10</h1>

    <section>
        <h2>Task 6: Counter</h2>
        <p id="count">0</p>
        <button id="increase">Increase</button>
        <button id="decrease">Decrease</button>
        <button id="reset">Reset</button>
    </section>

    <section>
        <h2>Task 7: Live Text Preview</h2>
        <input id="textInput" type="text" placeholder="Type something...">
        <p>Characters: <span id="charCount">0</span></p>
        <p id="preview">Your text will appear here.</p>
        <button id="clearText">Clear</button>
    </section>

    <section>
        <h2>Task 8: Image Selector</h2>
        <select id="imageSelect">
            <option value="football">Football</option>
            <option value="stadium">Stadium</option>
            <option value="trophy">Trophy</option>
        </select>
        <br>
        <img id="selectedImage" src="assets/football.jpg" alt="Football" width="250">
        <p id="imageCaption">Football</p>
    </section>

    <section>
        <h2>Task 9: Keyboard Events</h2>
        <input id="keyboardInput" type="text" placeholder="Press Enter or Escape">
        <p id="keyboardResult"></p>
    </section>

    <section id="focusCard" tabindex="0">
        <h2>Task 10: Mouse and Focus Events</h2>
        <p id="cardMessage">Move your mouse over this card or focus on it using Tab.</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
